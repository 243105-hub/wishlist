<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WishList Tabungan ✨ | Simpan Impianmu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f9f3e6 0%, #ffe6d5 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* Container utama */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header hero */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #c47c3e, #e7a15e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero h1 span {
            background: none;
            color: #e7a15e;
            font-size: 2.5rem;
        }

        .hero p {
            color: #7b5a3e;
            margin-top: 12px;
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* Statistik total tabungan */
        .stats-card {
            background: rgba(255, 248, 235, 0.9);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border: 1px solid #ffe2bf;
        }

        .total-saving {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            background: #ffffffcc;
            padding: 10px 24px;
            border-radius: 48px;
        }

        .total-saving .label {
            font-weight: 600;
            color: #b46f3a;
            font-size: 1.2rem;
        }

        .total-saving .amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: #2c5f2d;
            letter-spacing: 1px;
        }

        .total-saving .currency {
            font-size: 1.2rem;
            font-weight: 500;
            color: #7b5a3e;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 12px 28px;
            border-radius: 44px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #e7a15e;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #d48a44;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(231, 161, 94, 0.5);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #e7a15e;
            color: #b46f3a;
        }

        .btn-outline:hover {
            background: #fbe7d4;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ffe1de;
            color: #c75c4a;
            border: 1px solid #ffc7bc;
        }

        .btn-danger:hover {
            background: #ffcdc2;
            color: #a33f2c;
        }

        /* Form tambah wishlist */
        .form-card {
            background: white;
            border-radius: 48px;
            padding: 1.8rem 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid #ffeedd;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #6b3f1c;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #a36434;
            font-size: 0.85rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 32px;
            border: 1.5px solid #f0dbbc;
            background: #fefaf5;
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e7a15e;
            box-shadow: 0 0 0 3px rgba(231,161,94,0.2);
        }

        .btn-add {
            background: #2c5f2d;
            color: white;
            padding: 12px 32px;
            border-radius: 44px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn-add:hover {
            background: #1f4520;
            transform: scale(0.97);
        }

        /* Daftar wishlist */
        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .wishlist-header h2 {
            font-size: 1.8rem;
            color: #573e26;
            font-weight: 700;
        }

        .empty-state {
            background: #fff7ef;
            border-radius: 48px;
            padding: 3rem;
            text-align: center;
            color: #b18154;
            font-size: 1.2rem;
        }

        /* Grid cards */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        .wish-card {
            background: white;
            border-radius: 40px;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f8e2ca;
            display: flex;
            flex-direction: column;
        }

        .wish-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 36px -12px rgba(0,0,0,0.15);
        }

        .card-content {
            padding: 1.6rem 1.5rem 1.2rem;
            flex: 1;
        }

        .wish-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #3c2a1f;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .progress-section {
            margin: 1rem 0 0.8rem;
        }

        .price-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .price-label {
            color: #8b694a;
        }

        .price-value {
            font-weight: 700;
            color: #2c5f2d;
        }

        .progress-bar-bg {
            background: #f0e0cf;
            border-radius: 60px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }

        .progress-fill {
            background: #e7a15e;
            width: 0%;
            height: 100%;
            border-radius: 60px;
            transition: width 0.3s ease;
        }

        .saved-amount {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: 500;
        }

        .saved-text {
            color: #6a4e32;
        }

        .remaining-text {
            color: #bb7e4a;
            font-size: 0.85rem;
        }

        .card-actions {
            padding: 0.8rem 1.5rem 1.5rem;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #fae6d4;
            background: #fffbf5;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .small-input {
            width: 100px;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #ffd8b5;
            text-align: center;
            font-weight: 500;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.1s;
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn.deposit {
            background: #e2f3e2;
            color: #2c5f2d;
        }
        .icon-btn.deposit:hover {
            background: #cbe5cb;
        }
        .icon-btn.withdraw {
            background: #ffe3dd;
            color: #c46853;
        }
        .icon-btn.withdraw:hover {
            background: #ffd2c8;
        }
        .icon-btn.delete {
            background: #f7ece8;
            color: #ac5a48;
        }
        .icon-btn.delete:hover {
            background: #fadbd2;
            color: #a13d28;
        }

        @media (max-width: 650px) {
            body {
                padding: 1rem;
            }
            .stats-card {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .action-buttons {
                justify-content: center;
            }
            .form-grid {
                flex-direction: column;
            }
            .btn-add {
                width: 100%;
            }
            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>
            <span>🐷</span> Celengan Wishlist <span>✨</span>
        </h1>
        <p>Kumpulkan tabunganmu untuk membeli barang impian! Kelola dana, lacak progres, wujudkan mimpi.</p>
    </div>

    <div class="stats-card">
        <div class="total-saving">
            <span class="label">💎 Total Tabungan Aktif:</span>
            <span class="amount" id="totalSavingsAmount">0</span>
            <span class="currency">IDR</span>
        </div>
        <div class="action-buttons">
            <button class="btn btn-outline" id="resetAllDataBtn">🔄 Reset Semua Wishlist</button>
            <button class="btn btn-primary" id="exampleWishBtn">🌟 + Contoh Wishlist</button>
        </div>
    </div>

    <!-- Form tambah wishlist baru -->
    <div class="form-card">
        <div class="form-title">
            <span>➕</span> Tambah Wishlist Baru
        </div>
        <div class="form-grid">
            <div class="input-group">
                <label>Nama Impian</label>
                <input type="text" id="wishName" placeholder="Contoh: Kamera Mirrorless, Laptop, Liburan" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Target Harga (IDR)</label>
                <input type="number" id="targetPrice" placeholder="0" min="1" step="1000">
            </div>
            <div class="input-group">
                <label>Tabungan Awal (opsional)</label>
                <input type="number" id="initialSave" placeholder="0" min="0" step="1000" value="0">
            </div>
            <button class="btn-add" id="addWishBtn">➕ Buat Wishlist</button>
        </div>
    </div>

    <div class="wishlist-header">
        <h2>📋 Daftar Wishlist & Tabungan</h2>
        <span style="font-size:0.85rem; background:#eee1d4; padding:6px 14px; border-radius: 30px;">🏦 Kelola saldo per mimpi</span>
    </div>

    <div id="wishlistContainer" class="wishlist-grid">
        <!-- dynamic cards akan muncul di sini -->
        <div class="empty-state">✨ Belum ada wishlist. Yuk tambah impianmu di atas! ✨</div>
    </div>
</div>

<script>
    // ----- STORAGE KEY -----
    const STORAGE_KEY = "wishlist_tabungan_app";

    // Model: { id, name, target, saved }
    let wishlists = [];

    // ----- Helper functions -----
    function loadFromLocalStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                wishlists = JSON.parse(stored);
                // validasi sederhana: pastikan setiap item punya properti yang benar
                wishlists = wishlists.filter(item => item && typeof item.id === 'number' && typeof item.name === 'string' && typeof item.target === 'number' && typeof item.saved === 'number');
                // bersihkan nilai negatif / NaN
                wishlists.forEach(w => {
                    if (isNaN(w.target) || w.target <= 0) w.target = 1;
                    if (isNaN(w.saved)) w.saved = 0;
                    if (w.saved < 0) w.saved = 0;
                    if (w.saved > w.target) w.saved = w.target;
                });
            } catch(e) { wishlists = []; }
        } else {
            // data awal: beberapa contoh menarik (optional)
            wishlists = [];
        }
        renderAll();
    }

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(wishlists));
        updateTotalSavings();
    }

    function updateTotalSavings() {
        const total = wishlists.reduce((sum, item) => sum + (item.saved || 0), 0);
        const totalElem = document.getElementById("totalSavingsAmount");
        if (totalElem) totalElem.innerText = total.toLocaleString('id-ID');
    }

    // render semua wishlist card
    function renderAll() {
        const container = document.getElementById("wishlistContainer");
        if (!container) return;

        if (wishlists.length === 0) {
            container.innerHTML = `<div class="empty-state">🐣 Belum ada wishlist. Mulai tabung impian sekarang! 🎯</div>`;
            updateTotalSavings();
            return;
        }

        // urutkan berdasarkan id (terbaru diatas / descending)
        const sorted = [...wishlists].sort((a,b) => b.id - a.id);
        container.innerHTML = sorted.map(wish => createCardHTML(wish)).join('');

        // attach event untuk setiap card setelah dirender
        attachCardEvents();

        updateTotalSavings();
    }

    function createCardHTML(wish) {
        const percent = Math.min(100, Math.floor((wish.saved / wish.target) * 100));
        const remaining = wish.target - wish.saved;
        const formattedTarget = wish.target.toLocaleString('id-ID');
        const formattedSaved = wish.saved.toLocaleString('id-ID');
        const formattedRemaining = remaining.toLocaleString('id-ID');

        return `
            <div class="wish-card" data-id="${wish.id}">
                <div class="card-content">
                    <div class="wish-title">🎯 ${escapeHtml(wish.name)}</div>
                    <div class="progress-section">
                        <div class="price-info">
                            <span class="price-label">🎯 Target</span>
                            <span class="price-value">Rp ${formattedTarget}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: ${percent}%;"></div>
                        </div>
                        <div class="saved-amount">
                            <span class="saved-text">💵 Terkumpul: <strong>Rp ${formattedSaved}</strong></span>
                            <span class="remaining-text">${percent}%</span>
                        </div>
                        ${remaining > 0 ? `<div style="margin-top: 8px; font-size: 0.8rem; color:#b97f4b;">💔 Kekurangan: Rp ${formattedRemaining}</div>` : `<div style="margin-top: 8px; font-size: 0.9rem; font-weight: bold; color:#2c5f2d;">✨ SELESAI! Segera realisasikan ✨</div>`}
                    </div>
                </div>
                <div class="card-actions">
                    <div class="action-group">
                        <input type="number" class="small-input" id="amountInput-${wish.id}" placeholder="jumlah" value="10000" step="5000" min="1">
                        <button class="icon-btn deposit" data-action="deposit" data-id="${wish.id}" title="Tambah tabungan">➕ Setor</button>
                        <button class="icon-btn withdraw" data-action="withdraw" data-id="${wish.id}" title="Ambil tabungan">🔻 Tarik</button>
                    </div>
                    <div class="action-group">
                        <button class="icon-btn delete" data-action="delete" data-id="${wish.id}" title="Hapus wishlist">🗑️ Hapus</button>
                    </div>
                </div>
            </div>
        `;
    }

    // attachment events setelah DOM card terupdate
    function attachCardEvents() {
        // Deposit
        document.querySelectorAll('.icon-btn.deposit').forEach(btn => {
            btn.removeEventListener('click', handleDeposit);
            btn.addEventListener('click', handleDeposit);
        });
        // Withdraw
        document.querySelectorAll('.icon-btn.withdraw').forEach(btn => {
            btn.removeEventListener('click', handleWithdraw);
            btn.addEventListener('click', handleWithdraw);
        });
        // Delete
        document.querySelectorAll('.icon-btn.delete').forEach(btn => {
            btn.removeEventListener('click', handleDelete);
            btn.addEventListener('click', handleDelete);
        });
    }

    function getWishlistIdFromEvent(element) {
        const cardBtn = element.closest('.icon-btn');
        if (!cardBtn) return null;
        const idStr = cardBtn.getAttribute('data-id');
        if (!idStr) return null;
        return parseInt(idStr);
    }

    function handleDeposit(event) {
        const btn = event.currentTarget;
        const wishId = parseInt(btn.getAttribute('data-id'));
        if (isNaN(wishId)) return;
        const cardDiv = btn.closest('.wish-card');
        const inputElem = cardDiv ? cardDiv.querySelector('.small-input') : null;
        let amount = 0;
        if (inputElem) {
            amount = parseFloat(inputElem.value);
            if (isNaN(amount) || amount <= 0) amount = 0;
        }
        if (amount <= 0) {
            alert("Masukkan nominal positif (minimal 1 rupiah)");
            return;
        }
        const wishIndex = wishlists.findIndex(w => w.id === wishId);
        if (wishIndex === -1) return;
        let newSaved = wishlists[wishIndex].saved + amount;
        if (newSaved > wishlists[wishIndex].target) {
            alert(`⚠️ Tabungan melebihi target! Maksimal Rp ${wishlists[wishIndex].target.toLocaleString('id-ID')}. Sisa akan disesuaikan.`);
            newSaved = wishlists[wishIndex].target;
        }
        wishlists[wishIndex].saved = newSaved;
        saveToLocalStorage();
        renderAll();
    }

    function handleWithdraw(event) {
        const btn = event.currentTarget;
        const wishId = parseInt(btn.getAttribute('data-id'));
        if (isNaN(wishId)) return;
        const cardDiv = btn.closest('.wish-card');
        const inputElem = cardDiv ? cardDiv.querySelector('.small-input') : null;
        let amount = 0;
        if (inputElem) {
            amount = parseFloat(inputElem.value);
            if (isNaN(amount) || amount <= 0) amount = 0;
        }
        if (amount <= 0) {
            alert("Masukkan nominal penarikan yang valid (positif)");
            return;
        }
        const wishIndex = wishlists.findIndex(w => w.id === wishId);
        if (wishIndex === -1) return;
        let currentSaved = wishlists[wishIndex].saved;
        if (amount > currentSaved) {
            alert(`Saldo tidak mencukupi! Tersedia: Rp ${currentSaved.toLocaleString('id-ID')}`);
            return;
        }
        wishlists[wishIndex].saved = currentSaved - amount;
        saveToLocalStorage();
        renderAll();
    }

    function handleDelete(event) {
        const btn = event.currentTarget;
        const wishId = parseInt(btn.getAttribute('data-id'));
        if (isNaN(wishId)) return;
        const confirmDelete = confirm("Hapus wishlist ini? Semua tabungan terkait akan hilang.");
        if (!confirmDelete) return;
        wishlists = wishlists.filter(w => w.id !== wishId);
        saveToLocalStorage();
        renderAll();
    }

    // Fungsi tambah wishlist baru
    function addWishlist() {
        const nameInput = document.getElementById("wishName");
        const targetInput = document.getElementById("targetPrice");
        const initialInput = document.getElementById("initialSave");

        let name = nameInput.value.trim();
        let target = parseFloat(targetInput.value);
        let initial = parseFloat(initialInput.value);

        if (!name) {
            alert("Nama wishlist tidak boleh kosong!");
            return;
        }
        if (isNaN(target) || target <= 0) {
            alert("Target harga harus lebih dari 0 (IDR)");
            return;
        }
        if (isNaN(initial)) initial = 0;
        if (initial < 0) initial = 0;
        if (initial > target) {
            alert("Tabungan awal tidak boleh melebihi target. Akan disesuaikan ke target.");
            initial = target;
        }

        const newId = Date.now(); // cukup unik
        const newWish = {
            id: newId,
            name: name,
            target: target,
            saved: initial
        };
        wishlists.push(newWish);
        saveToLocalStorage();

        // reset form
        nameInput.value = "";
        targetInput.value = "";
        initialInput.value = "0";

        renderAll();
    }

    // reset semua data
    function resetAllData() {
        const confirmReset = confirm("‼️ PERHATIAN: Semua wishlist & tabungan akan dihapus permanen. Lanjutkan?");
        if (confirmReset) {
            wishlists = [];
            saveToLocalStorage();
            renderAll();
        }
    }

    // tambah contoh wishlist (demo)
    function addExampleWishlist() {
        const examples = [
            { name: "📷 Kamera Mirrorless Sony", target: 8500000, saved: 1250000 },
            { name: "💻 MacBook Air M2", target: 16500000, saved: 4200000 },
            { name: "✈️ Liburan ke Bali", target: 5000000, saved: 1800000 },
            { name: "🎧 Headphone Noise Cancelling", target: 2800000, saved: 700000 },
            { name: "🎮 Nintendo Switch + Game", target: 4800000, saved: 900000 }
        ];
        for (let ex of examples) {
            // cek agar tidak terlalu banyak duplikasi jika user sudah punya nama mirip? tidak masalah, tetap tambah.
            const newId = Date.now() + Math.floor(Math.random() * 10000);
            wishlists.push({
                id: newId,
                name: ex.name,
                target: ex.target,
                saved: ex.saved
            });
        }
        saveToLocalStorage();
        renderAll();
        alert("✨ 5 contoh wishlist ditambahkan! Kamu bisa edit tabungannya.");
    }

    // fungsi sederhana untuk escape HTML (mencegah XSS)
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // event listeners global
    document.addEventListener("DOMContentLoaded", () => {
        loadFromLocalStorage();

        const addBtn = document.getElementById("addWishBtn");
        if (addBtn) addBtn.addEventListener("click", addWishlist);

        const resetBtn = document.getElementById("resetAllDataBtn");
        if (resetBtn) resetBtn.addEventListener("click", resetAllData);

        const exampleBtn = document.getElementById("exampleWishBtn");
        if (exampleBtn) exampleBtn.addEventListener("click", addExampleWishlist);

        // juga tekan enter pada form input bisa nyaman? Tambahan opsi
        const nameField = document.getElementById("wishName");
        const targetField = document.getElementById("targetPrice");
        const initialField = document.getElementById("initialSave");
        const handleEnter = (e) => {
            if (e.key === "Enter") addWishlist();
        };
        if(nameField) nameField.addEventListener("keypress", handleEnter);
        if(targetField) targetField.addEventListener("keypress", handleEnter);
        if(initialField) initialField.addEventListener("keypress", handleEnter);
    });
</script>
</body>
